server:
  port: ${CONFIG_SERVER_PORT:8660}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:config-server}
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/consolefire/spring-cloud-infra-config}
          default-label: ${CONFIG_GIT_LABEL:main}
          clone-on-start: ${CONFIG_CLONE_ON_START:false}
          timeout: 5

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh