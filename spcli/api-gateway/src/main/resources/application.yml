server:
  port: ${SERVER_PORT:8000}



management:
  server:
    port: ${MGMT_SERVER_PORT:${server.port}}
  endpoints:
    web:
      base-path: ${MGMT_BASE_PATH:/ctrl-tower}
      exposure:
        include: health, info, metrics, prometheus, gateway, refresh

# Eureka client disabled by default so it never attempts to connect on startup
eureka:
  client:
    enabled: false
    healthcheck:
      enabled: true
  instance:
    statusPageUrlPath: ${MGMT_BASE_PATH:/ctrl-tower}/info
    healthCheckUrlPath: ${MGMT_BASE_PATH:/ctrl-tower}/health
    homePageUrl: https://${eureka.hostname}${MGMT_BASE_PATH:/ctrl-tower}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}

---
# =====================================================================
# PROFILE: with-external-routes
# Activated via: -Dspring.profiles.active=with-external-routes
# =====================================================================
spring:
  config:
    activate:
      on-profile: with-external-routes
    location: ${EXT_ROUTE_CONFIG:${tempDir}/routes.yml}

---
# =====================================================================
# PROFILE: with-eureka-discovery
# Activated via: -Dspring.profiles.active=with-eureka-discovery
# =====================================================================
spring:
  config:
    activate:
      on-profile: with-eureka-discovery
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    enabled: ${DISCOVERY_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: ${DISCOVERY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${DISCOVERY_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${DISCOVERY_INSTANCE_PREFER_IP:false}

---
# =====================================================================
# PROFILE: with-cloud-config
# Activated via: -Dspring.profiles.active=with-cloud-config
# =====================================================================
spring:
  config:
    activate:
      on-profile: with-cloud-config
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server.internal:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 2000
        multiplier: 1.5

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway, refresh, busrefresh

---
# =====================================================================
# PROFILE: secured-with-oauth2
# Activated via: -Dspring.profiles.active=secured-with-oauth2
# =====================================================================
spring:
  config:
    activate:
      on-profile: secured-with-oauth2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:https://your-auth-server.com/realms/your-realm}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway, refresh